# herd.gamepad: drive Herdr with a game controller.
# Design: docs/plans/2026-10-27-gamepad-design.md
# Settings: $(herdr plugin config-dir herd.gamepad)/config.toml — whisper.model, whisper.language,
# voice.button (rstick, lstick, menu), voice.max_seconds.

id = "herd.gamepad"
name = "Gamepad"
version = "0.2.0"
description = "Drive Herdr with a game controller: focus panes, tabs and spaces, answer agents, hold a button to talk."
min_herdr_version = "0.9.1"
platforms = ["macos"]

[[build]]
platforms = ["macos"]
command = ["/bin/sh", "scripts/build.sh"]

[[panes]]
id = "logs"
title = "Gamepad logs"
placement = "overlay"
command = ["./bin/herd-gamepad", "logs"]

[[panes]]
id = "mapping"
title = "Gamepad mapping"
placement = "overlay"
command = ["./bin/herd-gamepad", "mapping"]

[[panes]]
id = "close-menu"
title = "Gamepad close actions"
placement = "popup"
width = 64
height = 12
command = ["./bin/herd-gamepad", "close-menu"]

[[actions]]
id = "start"
title = "Gamepad: start"
description = "Listen in the background, unless already running."
command = ["./bin/herd-gamepad", "serve"]

[[actions]]
id = "setup"
title = "Gamepad: set up voice"
description = "Check whisper-cli and download the speech model."
command = ["./bin/herd-gamepad", "setup"]

[[actions]]
id = "show-mapping"
title = "Gamepad: show the mapping"
description = "What each button does."
command = ["./bin/herd-gamepad", "open-mapping"]

[[actions]]
id = "stop"
title = "Gamepad: stop"
description = "Stop listening and cancel active voice work."
command = ["./bin/herd-gamepad", "stop"]

[[actions]]
id = "show-logs"
title = "Gamepad: show logs"
description = "Open recent daemon diagnostics."
command = ["./bin/herd-gamepad", "open-logs"]
