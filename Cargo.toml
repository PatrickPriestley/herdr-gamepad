[package]
name = "herd-gamepad"
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
description = "Herdr plugin: drive Herdr with a game controller"
license = "MIT"
repository = "https://github.com/PatrickPriestley/herdr-gamepad"
readme = "README.md"

[[bin]]
name = "herd-gamepad"
path = "src/main.rs"

[dependencies]
gilrs = "0.11"
cpal = "0.18"
hound = "3.5"
serde_json = "1"
toml = "0.8"
toml_edit = "0.22.27"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
unicode-width = "0.2"
unicode-segmentation = "1.12"

[profile.release]
strip = true
lto = "thin"
