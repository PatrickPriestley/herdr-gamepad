<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 760" width="1160" height="760" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14">
  <title>herd-gamepad controls on a PS5 DualSense</title>
  <desc>A front view of a DualSense controller. Callouts name each control and what herd-gamepad does when it is pressed in Navigate mode, Respond mode, and the close menu.</desc>
  <style>
    .shell { fill: #f7f8fa; stroke: #374151; stroke-width: 2.2; stroke-linejoin: round; }
    .face  { fill: #dfe3e8; stroke: none; }
    .recess { fill: #cfd4db; stroke: none; }
    .part  { fill: #e9ecef; stroke: #4b5563; stroke-width: 1.6; }
    .btn   { fill: #ffffff; stroke: #374151; stroke-width: 1.6; }
    .glyph { fill: none; stroke: #111827; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .lightbar { fill: none; stroke: #93c5fd; stroke-width: 3; stroke-linecap: round; }
    .lead  { stroke: #6b7280; stroke-width: 1.3; fill: none; }
    .dot   { fill: #6b7280; }
    .name  { font-weight: 700; fill: #111827; }
    .act   { fill: #1f2937; }
    .mode  { fill: #6b7280; font-size: 12px; }
    .tag   { fill: #374151; font-size: 11px; font-weight: 700; }
    .title { font-size: 20px; font-weight: 700; fill: #111827; }
    .note  { fill: #4b5563; font-size: 13px; }
  </style>

  <text class="title" x="40" y="42">herd-gamepad on a PS5 DualSense</text>
  <text class="note" x="40" y="64">v0.2.0. Positions define the actions: an Xbox controller maps A, B, X and Y to the same four spots.</text>

  <!-- Triggers (behind) and shoulders, drawn before the shell so its top edge overlaps them -->
  <g transform="rotate(-9 379 183)"><rect class="part" x="346" y="174" width="66" height="18" rx="8"/><text class="tag" x="379" y="187" text-anchor="middle">L2</text></g>
  <g transform="rotate(9 781 183)"><rect class="part" x="748" y="174" width="66" height="18" rx="8"/><text class="tag" x="781" y="187" text-anchor="middle">R2</text></g>
  <g transform="rotate(-7 376 203)"><rect class="part" x="336" y="194" width="80" height="18" rx="8"/><text class="tag" x="376" y="207" text-anchor="middle">L1</text></g>
  <g transform="rotate(7 784 203)"><rect class="part" x="744" y="194" width="80" height="18" rx="8"/><text class="tag" x="784" y="207" text-anchor="middle">R1</text></g>

  <!-- Outer shell: arched top, flared sides, long grips, concave chin -->
  <path class="shell" d="
    M 332 216
    C 410 178, 500 164, 580 164
    C 660 164, 750 178, 828 216
    C 846 236, 858 270, 858 318
    C 868 384, 886 478, 852 540
    C 828 582, 768 584, 746 538
    C 732 506, 722 462, 708 430
    C 672 454, 628 464, 580 464
    C 532 464, 488 454, 452 430
    C 438 462, 428 506, 414 538
    C 392 584, 332 582, 308 540
    C 274 478, 292 384, 302 318
    C 302 270, 314 236, 332 216 Z"/>

  <!-- Inner face plate -->
  <path class="face" d="
    M 440 232
    C 500 206, 660 206, 720 232
    C 736 290, 724 352, 694 398
    C 660 430, 500 430, 466 398
    C 436 352, 424 290, 440 232 Z"/>

  <!-- Touchpad with light bar edges -->
  <rect class="part" x="486" y="190" width="188" height="80" rx="22"/>
  <path class="lightbar" d="M 488 212 C 484 232, 484 250, 490 266"/>
  <path class="lightbar" d="M 672 212 C 676 232, 676 250, 670 266"/>

  <!-- Create and Options -->
  <g transform="rotate(-22 466 214)"><rect class="btn" x="459" y="200" width="14" height="28" rx="6"/></g>
  <g transform="rotate(22 694 214)"><rect class="btn" x="687" y="200" width="14" height="28" rx="6"/></g>

  <!-- D-pad in its recess -->
  <circle class="recess" cx="402" cy="296" r="42"/>
  <g class="btn">
    <rect x="391" y="258" width="22" height="76" rx="5"/>
    <rect x="364" y="285" width="76" height="22" rx="5"/>
  </g>
  <rect fill="#ffffff" x="392" y="286" width="20" height="20"/>
  <path fill="#111827" d="M402 266 l-5 7 h10 z M402 326 l-5 -7 h10 z M372 296 l7 -5 v10 z M432 296 l-7 -5 v10 z"/>

  <!-- Face buttons in their recess -->
  <circle class="recess" cx="758" cy="296" r="46"/>
  <circle class="btn" cx="758" cy="264" r="14"/>
  <circle class="btn" cx="790" cy="296" r="14"/>
  <circle class="btn" cx="758" cy="328" r="14"/>
  <circle class="btn" cx="726" cy="296" r="14"/>
  <path class="glyph" d="M758 256 L766 270 H750 Z"/>
  <circle class="glyph" cx="790" cy="296" r="6.5"/>
  <path class="glyph" d="M752 322 L764 334 M764 322 L752 334"/>
  <rect class="glyph" x="719.5" y="289.5" width="13" height="13"/>

  <!-- Speaker, PS button, mic -->
  <g fill="#9ca3af">
    <circle cx="566" cy="318" r="1.6"/><circle cx="573" cy="318" r="1.6"/><circle cx="580" cy="318" r="1.6"/><circle cx="587" cy="318" r="1.6"/><circle cx="594" cy="318" r="1.6"/>
    <circle cx="569.5" cy="324" r="1.6"/><circle cx="576.5" cy="324" r="1.6"/><circle cx="583.5" cy="324" r="1.6"/><circle cx="590.5" cy="324" r="1.6"/>
  </g>
  <circle class="btn" cx="580" cy="352" r="11"/>
  <rect class="btn" x="567" y="382" width="26" height="7" rx="3.5"/>

  <!-- Sticks -->
  <circle class="recess" cx="492" cy="382" r="36"/>
  <circle class="part" cx="492" cy="382" r="28"/>
  <circle class="btn" cx="492" cy="382" r="19"/>
  <circle class="recess" cx="668" cy="382" r="36"/>
  <circle class="part" cx="668" cy="382" r="28"/>
  <circle class="btn" cx="668" cy="382" r="19"/>
  <text class="tag" x="492" y="386" text-anchor="middle">L3</text>
  <text class="tag" x="668" y="386" text-anchor="middle">R3</text>

  <!-- Left callouts -->
  <g>
    <text class="name" x="40" y="146">L2 trigger</text>
    <text class="act" x="40" y="165">Previous tab</text>
    <path class="lead" d="M 150 150 H 300 C 330 150, 340 160, 352 172"/>
    <circle class="dot" cx="352" cy="172" r="3"/>
  </g>
  <g>
    <text class="name" x="40" y="206">L1 shoulder</text>
    <text class="act" x="40" y="225">Previous space</text>
    <path class="lead" d="M 160 210 H 300 C 320 210, 328 206, 340 200"/>
    <circle class="dot" cx="340" cy="200" r="3"/>
  </g>
  <g>
    <text class="name" x="40" y="262">Create</text>
    <text class="act" x="40" y="281">Escape, in Respond and Interact</text>
    <text class="mode" x="40" y="298">Close menu: cancel</text>
    <path class="lead" d="M 170 266 H 360 C 420 266, 436 244, 456 216"/>
    <circle class="dot" cx="456" cy="216" r="3"/>
  </g>
  <g>
    <text class="name" x="40" y="356">D-pad</text>
    <text class="act" x="40" y="375">Navigate: focus the neighbouring pane</text>
    <text class="act" x="40" y="393">Respond and Interact: arrow keys</text>
    <text class="mode" x="40" y="410">Always moves focus in Navigate</text>
    <path class="lead" d="M 334 360 C 350 360, 356 340, 364 322"/>
    <circle class="dot" cx="364" cy="322" r="3"/>
  </g>
  <g>
    <text class="name" x="40" y="500">L3 left stick click</text>
    <text class="act" x="40" y="519">Opens the close menu when the voice</text>
    <text class="act" x="40" y="537">button is set to Options</text>
    <path class="lead" d="M 262 504 H 420 C 450 504, 462 470, 470 418"/>
    <circle class="dot" cx="470" cy="418" r="3"/>
  </g>

  <!-- Right callouts -->
  <g>
    <text class="name" x="880" y="146">R2 trigger</text>
    <text class="act" x="880" y="165">Next tab</text>
    <path class="lead" d="M 870 150 H 860 C 830 150, 820 160, 808 172"/>
    <circle class="dot" cx="808" cy="172" r="3"/>
  </g>
  <g>
    <text class="name" x="880" y="206">R1 shoulder</text>
    <text class="act" x="880" y="225">Next space</text>
    <path class="lead" d="M 870 210 H 860 C 840 210, 832 206, 820 200"/>
    <circle class="dot" cx="820" cy="200" r="3"/>
  </g>
  <g>
    <text class="name" x="880" y="262">Options</text>
    <text class="act" x="880" y="281">Open the close menu</text>
    <text class="mode" x="880" y="298">Pressing it again cancels</text>
    <path class="lead" d="M 870 266 H 800 C 740 266, 724 244, 704 216"/>
    <circle class="dot" cx="704" cy="216" r="3"/>
  </g>
  <g>
    <text class="name" x="880" y="340">Triangle</text>
    <text class="act" x="880" y="359">Focus the next agent that needs you</text>
    <text class="mode" x="880" y="376">Also leaves Respond or Interact</text>
    <text class="mode" x="880" y="392">Close menu: select "close space"</text>
    <path class="lead" d="M 870 344 H 830 C 800 344, 786 310, 772 266"/>
    <circle class="dot" cx="772" cy="266" r="3"/>
  </g>
  <g>
    <text class="name" x="880" y="416">Circle</text>
    <text class="act" x="880" y="435">Back to Navigate, sending nothing</text>
    <text class="mode" x="880" y="452">Close menu: cancel</text>
    <path class="lead" d="M 870 420 H 850 C 826 420, 812 360, 804 300"/>
    <circle class="dot" cx="804" cy="300" r="3"/>
  </g>
  <g>
    <text class="name" x="880" y="494">Cross</text>
    <text class="act" x="880" y="513">Agent pane: enter Respond; a waiting</text>
    <text class="act" x="880" y="531">agent is answered by this same press</text>
    <text class="act" x="880" y="549">Other pane: enter Interact. Then: Enter</text>
    <text class="mode" x="880" y="566">Close menu: confirm the selected close</text>
    <path class="lead" d="M 870 498 H 846 C 810 498, 782 420, 768 342"/>
    <circle class="dot" cx="768" cy="342" r="3"/>
  </g>
  <g>
    <text class="name" x="880" y="626">Square</text>
    <text class="act" x="880" y="645">Toggle zoom; in Interact, Space</text>
    <text class="mode" x="880" y="662">Close menu: select "close pane"</text>
    <path class="lead" d="M 870 630 H 830 C 760 630, 700 480, 716 308"/>
    <circle class="dot" cx="716" cy="308" r="3"/>
  </g>

  <!-- Bottom callout -->
  <g>
    <text class="name" x="580" y="656" text-anchor="middle">R3 right stick click</text>
    <text class="act" x="580" y="675" text-anchor="middle">Hold to dictate, release to send (default voice button)</text>
    <text class="mode" x="580" y="692" text-anchor="middle">Sent to an idle, done or working agent; dropped if focus moved or the agent is at a dialog</text>
    <path class="lead" d="M 606 640 C 626 570, 650 470, 666 420"/>
    <circle class="dot" cx="666" cy="420" r="3"/>
  </g>
  <text class="note" x="580" y="736" text-anchor="middle">Not used: touchpad, PS button, mic button, analog stick movement. Routine status goes to Gamepad logs; errors show as notifications.</text>
</svg>
