name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: Test and build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Test
        run: |
          python3 -m unittest discover -s tests -p 'test_release*.py'
          cargo test --locked
      - name: Build through the plugin entrypoint
        env:
          HERD_GAMEPAD_BUILD: source
        run: sh tests/build.sh && sh scripts/build.sh
      - name: Smoke test the installed layout
        env:
          HERDR_PLUGIN_CONFIG_DIR: ${{ runner.temp }}/gamepad-config
          HERDR_PLUGIN_STATE_DIR: ${{ runner.temp }}/gamepad-state
        run: |
          ./bin/herd-gamepad version
          ./bin/herd-gamepad mapping < /dev/null
      - name: Package the release binary and its checksum
        run: |
          asset=herd-gamepad-${{ matrix.target }}.tar.gz
          mkdir -p dist
          tar -czf "dist/$asset" -C target/release herd-gamepad
          (cd dist && shasum -a 256 "$asset" > "$asset.sha256")
          cat "dist/$asset.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: herd-gamepad-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: macos
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: herd-gamepad-*
          path: dist
          merge-multiple: true
      - name: Publish verified source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py
      - name: Attach the macOS binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          set -- dist/herd-gamepad-*.tar.gz; test "$#" -eq 2
          set -- dist/herd-gamepad-*.tar.gz.sha256; test "$#" -eq 2
          gh release upload "$TAG" dist/herd-gamepad-*.tar.gz dist/herd-gamepad-*.tar.gz.sha256 --repo "$GITHUB_REPOSITORY" --clobber
